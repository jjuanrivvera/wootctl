# CI — delegates to the fleet-canonical reusable workflow in jjuanrivvera/.github.
# Change fleet-wide CI policy there, not here. Repo-specific inputs only live below.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # This repo's push and pull_request events do not reach Actions (verified: no
  # run in its entire history was triggered by either). Until that is resolved
  # with GitHub, workflow_dispatch is the only way to get CI to run at all.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: jjuanrivvera/.github/.github/workflows/go-ci.yml@main
    with:
      coverage-threshold: "80"
      run-gosec: true
      run-docs-check: true
